[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elpris"
version = "0.1.0"
description = "7-day spot price forecast (daily mean, max, min) for households in SE3"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.1",
    "scikit-learn==1.8.0",
    "httpx",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]